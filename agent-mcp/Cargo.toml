[package]
name = "agent-mcp"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "MCP-over-HTTP server exposing the `agent` CLI as tools, introspected from `agent --help-ai --json`."
repository = "https://github.com/sahuagin/agent_tools"

[[bin]]
name = "agent-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# Hand-written dynamic ServerHandler (no `macros` feature): tools are
# discovered at runtime from `agent --help-ai --json`, not at compile time.
rmcp = { version = "1.7", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
