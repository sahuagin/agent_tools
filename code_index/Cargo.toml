[package]
name = "code_index"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "code-index"
path = "src/main.rs"

[lib]
name = "code_index"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
petgraph = "0.6"
