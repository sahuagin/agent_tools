[package]
name = "code_index"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Code-aware indexing and retrieval for agentic workflows."
repository = "https://github.com/sahuagin/agent_tools"

[[bin]]
name = "code-index"
path = "src/main.rs"

[lib]
name = "code_index"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
petgraph = "0.6"
ureq = { version = "2", features = ["json", "tls"] }
