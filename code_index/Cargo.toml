[package]
name = "code_index"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Code-aware indexing and retrieval for agentic workflows."
repository = "https://github.com/sahuagin/agent_tools"

[[bin]]
name = "code-index"
path = "src/main.rs"

[lib]
name = "code_index"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
petgraph = "0.6"
