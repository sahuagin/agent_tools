[package]
name = "agent"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/sahuagin/agent_tools"

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap-catalog = { path = "../clap-catalog" }
# log + env_logger (operator preference, 2026-06-12): diagnostics and
# status messages go through `log` macros — RUST_LOG controls them at
# runtime, and release builds compile debug/trace out via the
# release_max_level_info feature. Command OUTPUT (results, --json) stays
# on stdout: that's the tool contract mu parses, not logging.
env_logger = "0.11"
log = { version = "0.4", features = ["release_max_level_info"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# kx knowledge-index config: the whole-file `[kx]` reader needs real TOML
# (arrays-of-tables `[[kx.sources]]`); the hand-rolled flat reader in embed.rs
# cannot parse those. Scoped to the kx config load; secrets are never logged.
toml = "0.8"
ureq = { version = "2", features = ["json", "tls"] }
uuid = { version = "1", features = ["v4"] }
